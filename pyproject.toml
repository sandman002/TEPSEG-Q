[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tepseg"
version = "1.0.0"
description = "Tumour epithelium regions in H&E whole-slide images (UNI2-h + MLP head), for QuPath and the command line"
readme = "README.md"
license = "CC-BY-NC-ND-4.0 AND CC-BY-NC-4.0"
license-files = ["LICENSE", "LICENSE-WEIGHTS"]
requires-python = ">=3.10,<3.13"
authors = [{ name = "Sandeep Manandhar", email = "sandeep.manandhar@emory.edu" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "shapely>=2.1",
    "tiffslide>=2.4",
    "tifffile>=2023.7",
    "pillow>=10",
    "torch>=2.2",
    "timm>=1.0.3",
    "huggingface_hub>=0.25",
    "pyisyntax>=0.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tepseg = "tepseg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tepseg"]

[tool.hatch.build.targets.sdist]
include = ["tepseg", "README.md", "LICENSE", "LICENSE-WEIGHTS", "pyproject.toml", "tests"]
